name: bh_edu
description: "BH-EDU School Management System - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.6.0
  
  # Storage
  shared_preferences: ^2.5.0
  
  # Utilities
  intl: ^0.20.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  
  # QR Code (for attendance)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  
  # Time formatting
  timeago: ^3.7.0
  
  # Biometric authentication
  local_auth: ^2.3.0
  
  # Calendar
  table_calendar: ^3.1.2
  
  # Charts for reports
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/

